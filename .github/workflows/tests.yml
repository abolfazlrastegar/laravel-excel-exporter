name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - laravel: "10.*"
            php: "8.2"
            testbench: "^8.0"

          - laravel: "11.*"
            php: "8.2"
            testbench: "^9.0"

          - laravel: "12.*"
            php: "8.3"
            testbench: "^10.0"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, gd, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --dev \
            --no-interaction \
            --prefer-dist

      - name: Validate Composer
        run: composer validate --strict

      - name: Run tests
        run: vendor/bin/phpunit